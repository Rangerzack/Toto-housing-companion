name: Load housing data into Supabase

# Manual trigger only — run this after pushing migrations with the Supabase
# CLI (or applying them via the SQL editor) and after committing the CSV
# under data/. Requires a repo secret named SUPABASE_DB_URL.
on:
  workflow_dispatch:
    inputs:
      csv_path:
        description: "Path to the CSV in this repo"
        required: false
        default: "data/Southern_Oregon_Housing_Matrix_REVERIFIED.csv"
      state:
        description: "Two-letter state the matrix covers (OR, MN). Only this state's rows are replaced."
        required: false
        default: "OR"

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      # This workflow writes to the production database, which the staging
      # branch shares. workflow_dispatch lets you pick any branch, so refuse to
      # run from one that is not master rather than quietly rewriting live data.
      - name: Refuse to run outside master
        if: github.ref_name != 'master'
        run: |
          echo "This workflow writes to the production database and must run from master."
          echo "Selected branch: ${{ github.ref_name }}"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply Supabase migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/apply_migrations.py

      - name: Load CSV into Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/load_data.py "${{ inputs.csv_path }}" "${{ inputs.state }}"
