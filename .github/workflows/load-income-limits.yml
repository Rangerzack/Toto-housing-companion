name: Load income limits

# Manual trigger. Income limits are reference data that changes a few times a
# year, on a different cadence from the program matrix, so this is separate
# from the load-data workflow.
on:
  workflow_dispatch:
    inputs:
      csv_path:
        description: "Path to the income limits CSV in this repo"
        required: false
        default: "data/income_limits_template.csv"
      rent_csv_path:
        description: "Optional: path to a rent limits CSV to load in the same run"
        required: false
        default: ""

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      # This workflow writes to the production database, which the staging
      # branch shares. workflow_dispatch lets you pick any branch, so refuse to
      # run from one that is not master rather than quietly rewriting live data.
      - name: Refuse to run outside master
        if: github.ref_name != 'master'
        run: |
          echo "This workflow writes to the production database and must run from master."
          echo "Selected branch: ${{ github.ref_name }}"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply Supabase migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/apply_migrations.py

      - name: Load income limits
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/load_income_limits.py "${{ inputs.csv_path }}"

      - name: Load rent limits
        if: ${{ inputs.rent_csv_path != '' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/load_rent_limits.py "${{ inputs.rent_csv_path }}"
