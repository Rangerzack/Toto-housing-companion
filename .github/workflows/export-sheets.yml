name: Export to Google Sheets

# Mirrors the current datasets to a Google Sheet. Called automatically at the
# end of every data-load workflow, and runnable by hand.
#
# Skips cleanly if the Google secrets are not set, so the loaders never fail
# because the sheet is not configured yet.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt gspread google-auth

      - name: Check configuration
        id: cfg
        env:
          SHEET: ${{ secrets.GOOGLE_SHEET_ID }}
          SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          if [ -z "$SHEET" ] || [ -z "$SA" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_SHEET_ID / GOOGLE_SA_JSON not set; skipping the sheet export."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to Google Sheets
        if: steps.cfg.outputs.configured == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python scripts/export_sheets.py

      # Always produce the CSVs too, so there is a downloadable snapshot even
      # when the sheet is not configured.
      - name: Write CSV snapshot
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/export_sheets.py --csv-dir snapshot

      - uses: actions/upload-artifact@v4
        with:
          name: dataset-snapshot
          path: snapshot/
