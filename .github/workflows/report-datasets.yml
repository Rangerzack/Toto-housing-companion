name: Report program datasets

# Which programs test against which income dataset, and why. Read-only: it
# applies migrations so the views exist, then queries them. It never writes
# program or limit data, which is why it is not restricted to master.
on:
  workflow_dispatch:
    inputs:
      state:
        description: "Limit to one state (OR, MN). Leave blank for all."
        required: false
        default: ""

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply Supabase migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/apply_migrations.py

      - name: Build the report
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python scripts/report_datasets.py \
            --csv program_datasets.csv \
            ${{ inputs.state && format('--state {0}', inputs.state) || '' }}

      - name: Upload the CSV
        uses: actions/upload-artifact@v4
        with:
          name: program-datasets${{ inputs.state && format('-{0}', inputs.state) || '' }}
          path: program_datasets.csv
