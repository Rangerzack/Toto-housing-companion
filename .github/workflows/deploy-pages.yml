name: Deploy screener to GitHub Pages

# Publishes web/ on every push to master. Pages can only serve from the repo
# root or /docs on its own, so this uploads the subfolder as an artifact
# instead — which keeps the screener where it lives.
on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Pages serves assets with max-age=600, so a returning visitor would keep
      # running stale JavaScript against freshly deployed HTML for up to ten
      # minutes. Stamping the commit SHA into the asset URLs makes each deploy
      # a new URL, which sidesteps the cache entirely.
      - name: Stamp asset versions
        run: |
          find web -type f \( -name '*.html' -o -name '*.js' \) \
            -exec sed -i "s/__BUILD__/${GITHUB_SHA::12}/g" {} +
          grep -r "__BUILD__" web && { echo "unstamped placeholders remain"; exit 1; } || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
